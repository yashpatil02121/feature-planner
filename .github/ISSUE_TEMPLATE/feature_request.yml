name: Feature request
description: Suggest an improvement to planning behavior, the plan format, or configuration.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the planner do instead? Include an example plan excerpt if it helps.
    validations:
      required: true
