schema_version: "1.1"
name: rest-endpoint
description: Plans a new REST endpoint on a small Express API, grounded in the real files, and saves a draft plan without touching source.
tags: [core, javascript]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: /feature-planner:fp Add the ability to mark a todo as done and delete a todo
context:
  scaffold_script: scaffold.sh
graders:
  - name: plan-saved
    type: file_exists
    path: plans/*.md
  - name: draft-status
    type: regex
    target: trace
    pattern: 'status: draft'
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: writes-only-plan
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*plans[\\/]+[^"\\/]+\.md")'
    min: 0
    max: 0
  - name: grounded-plan
    type: llm
    focus: trace
    criteria: |
      PASS only if the plan written with the Write tool:
      - references the real files src/store.js and src/routes/todos.js (and labels them confirmed);
      - proposes endpoints for both marking done and deleting, with 404 handling for unknown ids;
      - has ordered tasks with dependencies, acceptance criteria, and tests using node:test;
      - does not invent files that the trace never read except ones clearly labeled proposed.
